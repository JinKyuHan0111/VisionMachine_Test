# 화재 감지 시스템 운영 배포 (웹 대시보드 + 감지기)
# 이 폴더의 .env 를 사용함 (cp .env.example .env)
#
# 실행 방법 (docker/ 에서)
#   GitHub(GHCR) 이미지 사용:  docker compose pull && docker compose up -d --no-build
#   이 PC 에서 직접 빌드:      docker compose up -d --build
#   감지기까지 띄우려면 .env 에 COMPOSE_PROFILES=detector
#
#   인터넷 ──443/80──▶ caddy (자동 HTTPS) ──내부망──▶ app:8000 ──┐
#   RTSP 카메라 ──▶ detector (YOLO, 화면 없음) ──────────────────┴─▶ [volume] app-data (db/, captures/)
# app 컨테이너는 호스트 포트를 열지 않는다 (외부에서 직접 접근 불가).

services:
  app:
    build:
      context: ..                  # 빌드 컨텍스트 = 프로젝트 루트
      dockerfile: docker/Dockerfile
    image: ghcr.io/jinkyuhan0111/visionmachine-web:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      APP_ENV: production
      # 이 대역(아래 internal 네트워크)에서 온 X-Forwarded-For 만 신뢰
      FORWARDED_ALLOW_IPS: 172.28.0.0/24
    volumes:
      - app-data:/app/data
    expose:
      - "8000"
    networks:
      - internal
    read_only: true            # 루트 파일시스템 읽기 전용 (data 볼륨만 쓰기 가능)
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  detector:
    profiles: ["detector"]         # 기본은 꺼짐. .env 의 COMPOSE_PROFILES=detector 로 켬
    build:
      context: ..
      dockerfile: docker/Dockerfile.detector
    image: ghcr.io/jinkyuhan0111/visionmachine-detector:${IMAGE_TAG:-latest}
    depends_on:
      app:
        condition: service_healthy # DB 초기화/마이그레이션은 app 이 먼저 끝냄
    # env_file 대신 필요한 값만 전달 (세션 키·관리자 비밀번호는 감지기에 주지 않음)
    environment:
      CAMERA_SOURCES: ${CAMERA_SOURCES:-}   # 비어 있으면 감지기가 오류를 내고 멈춤
      CAMERA_NAMES: ${CAMERA_NAMES:-}
      DETECT_DEVICE: ${DETECT_DEVICE:-cpu}
      DETECT_CONF: ${DETECT_CONF:-0.25}
      FRAME_SKIP: ${FRAME_SKIP:-2}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_RECIPIENT: ${EMAIL_RECIPIENT:-}
    volumes:
      - app-data:/app/data         # 웹 대시보드와 같은 DB/캡처 폴더
      - ../models:/app/models:ro   # 프로젝트 루트의 models/fire_detector_best.pt
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 3g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # NVIDIA GPU 사용 시 (nvidia-container-toolkit 설치 + GPU 용 이미지 빌드 필요):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 을 .env 에 설정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # 인증서 보관 — 지우면 재발급(발급 횟수 제한 주의)
      - caddy-config:/config
    networks:
      - internal
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  app-data:
  caddy-data:
  caddy-config:
