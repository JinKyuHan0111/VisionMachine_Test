<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>승인 대기 - 화재 감지 대시보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .box {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 12px;
    padding: 48px 40px;
    width: 420px;
    text-align: center;
  }
  .icon { font-size: 3rem; margin-bottom: 20px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 12px; }
  p { color: #888; font-size: 0.88rem; line-height: 1.7; margin-bottom: 8px; }
  .username {
    display: inline-block;
    background: #ff6b3522;
    color: #ff6b35;
    padding: 2px 10px;
    border-radius: 5px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .steps {
    background: #12141c;
    border: 1px solid #2a2d3a;
    border-radius: 8px;
    padding: 16px 20px;
    text-align: left;
    margin: 20px 0;
  }
  .steps p { color: #aaa; margin: 0; }
  .step { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .step:last-child { margin-bottom: 0; }
  .step-num {
    background: #2a2d3a;
    color: #888;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .step-text { font-size: 0.83rem; color: #aaa; line-height: 1.5; }
  a.logout {
    display: inline-block;
    margin-top: 24px;
    color: #555;
    font-size: 0.82rem;
    text-decoration: none;
  }
  a.logout:hover { color: #888; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">⏳</div>
  <h1>관리자 승인 대기 중</h1>
  <div class="username">{{ user.username }}</div>
  <p>회원가입이 완료되었습니다.<br>관리자가 계정을 승인해야 대시보드를 이용할 수 있습니다.</p>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">관리자에게 승인 요청 (이메일 또는 직접 연락)</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">관리자가 계정을 <strong style="color:#e0e0e0;">회원</strong> 등급으로 승인</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">승인 완료 후 다시 로그인하여 대시보드 이용</div>
    </div>
  </div>

  <a href="/logout" class="logout">로그아웃</a>
</div>
</body>
</html>
