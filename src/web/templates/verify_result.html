<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이메일 인증 결과 - 화재 감지 대시보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .box {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 12px;
    padding: 48px 40px;
    width: 420px;
    text-align: center;
  }
  .icon { font-size: 3rem; margin-bottom: 20px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 14px; }
  p  { color: #888; font-size: 0.88rem; line-height: 1.7; margin-bottom: 20px; }
  .btn {
    display: inline-block;
    padding: 11px 28px;
    background: #ff6b35;
    color: #fff;
    border-radius: 7px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .btn:hover { background: #e85c28; }
  .btn-secondary {
    background: transparent;
    border: 1px solid #2a2d3a;
    color: #888;
  }
  .btn-secondary:hover { border-color: #64b5f6; color: #64b5f6; background: transparent; }
</style>
</head>
<body>
<div class="box">
  {% if success %}
  <div class="icon">✅</div>
  <h1>이메일 인증 완료!</h1>
  <p>
    이메일 인증이 성공적으로 완료되었습니다.<br>
    관리자가 계정을 승인하면 대시보드를 이용할 수 있습니다.
  </p>
  <a href="/pending" class="btn">승인 대기 페이지로 이동</a>
  {% else %}
  <div class="icon">❌</div>
  <h1>인증 링크가 유효하지 않습니다</h1>
  <p>
    링크가 만료되었거나 이미 사용된 링크입니다.<br>
    로그인 후 인증 이메일을 다시 발송해 주세요.
  </p>
  <a href="/login" class="btn btn-secondary">로그인으로 이동</a>
  {% endif %}
</div>
</body>
</html>
